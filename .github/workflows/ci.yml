name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  correctness:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Locked restore
        run: dotnet restore Lokad.Cli.slnx --locked-mode --tl:off
      - name: Debug tests
        run: dotnet test Lokad.Cli.slnx -c Debug --no-restore --tl:off
      - name: Release tests
        run: dotnet test Lokad.Cli.slnx -c Release --no-restore --tl:off
      - name: Exact Release package consumer
        shell: pwsh
        run: ./tools/PackageSmokeTest/verify-package.ps1 -NoBuild
